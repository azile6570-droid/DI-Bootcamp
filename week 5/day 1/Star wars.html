<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Star Wars Database</title>
  
  <!-- FontAwesome for loading icons -->
  <link 
    rel="stylesheet" 
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" 
  />
  
  <!-- Google Fonts for sci-fi futuristic typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #030408;
      color: #e2e8f0;
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* --- HYPERSPACE & NEBULA BACKGROUND --- */
    .space-bg {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: 
        radial-gradient(ellipse at top, rgba(255, 42, 95, 0.15), transparent 60%),
        radial-gradient(ellipse at bottom, rgba(0, 212, 255, 0.1), transparent 60%);
      z-index: 1;
    }

    .stars-layer-1, .stars-layer-2 {
      position: absolute;
      top: 0; left: 0; width: 200%; height: 200%;
      background-image: 
        radial-gradient(2px 2px at 20px 30px, #fff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 40px 70px, #ff2a5f, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 90px 40px, #fff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 160px 120px, #00d4ff, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 250px 250px;
      z-index: 2;
    }

    .stars-layer-1 {
      animation: starTravel 50s linear infinite;
      opacity: 0.8;
    }

    .stars-layer-2 {
      background-size: 380px 380px;
      animation: starTravel 90s linear infinite reverse;
      opacity: 0.5;
    }

    @keyframes starTravel {
      from { transform: translate(0, 0); }
      to { transform: translate(-250px, -250px); }
    }

    /* --- CONTAINER & HUD INTERFACE --- */
    .container {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 520px;
      text-align: center;
    }

    .header-badge {
      display: inline-block;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 3px;
      color: #00d4ff;
      text-transform: uppercase;
      margin-bottom: 5px;
      background: rgba(0, 212, 255, 0.1);
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid rgba(0, 212, 255, 0.3);
      box-shadow: 0 0 10px rgba(0, 212, 255, 0.2);
    }

    .logo {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 3rem;
      color: #ffffff;
      letter-spacing: 5px;
      margin-bottom: 25px;
      text-transform: uppercase;
      text-shadow: 
        0 0 10px rgba(255, 42, 95, 0.8),
        0 0 20px rgba(255, 42, 95, 0.5),
        0 0 35px rgba(255, 42, 95, 0.3);
    }

    /* HOLOGRAPHIC CARD */
    .card {
      position: relative;
      background: rgba(10, 14, 26, 0.75);
      border: 1px solid rgba(255, 42, 95, 0.4);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 35px 25px;
      min-height: 290px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 
        0 15px 35px rgba(0, 0, 0, 0.8),
        inset 0 0 15px rgba(255, 42, 95, 0.15),
        0 0 25px rgba(255, 42, 95, 0.2);
      margin-bottom: 30px;
      overflow: hidden;
      transition: all 0.4s ease;
    }

    /* Hologram Scanlines Effect */
    .card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.25) 50%
      );
      background-size: 100% 4px;
      z-index: 2;
      pointer-events: none;
      opacity: 0.6;
    }

    /* Futuristic Corner Accents */
    .card-corner {
      position: absolute;
      width: 12px;
      height: 12px;
      border-color: #00d4ff;
      border-style: solid;
    }
    .top-left { top: 10px; left: 10px; border-width: 2px 0 0 2px; }
    .top-right { top: 10px; right: 10px; border-width: 2px 2px 0 0; }
    .bottom-left { bottom: 10px; left: 10px; border-width: 0 0 2px 2px; }
    .bottom-right { bottom: 10px; right: 10px; border-width: 0 2px 2px 0; }

    .card:hover {
      border-color: rgba(255, 42, 95, 0.8);
      box-shadow: 
        0 20px 40px rgba(0, 0, 0, 0.9),
        inset 0 0 20px rgba(255, 42, 95, 0.25),
        0 0 40px rgba(255, 42, 95, 0.4);
    }

    #content {
      position: relative;
      z-index: 3;
      width: 100%;
    }

    .char-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 20px;
      letter-spacing: 1.5px;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }

    /* STATS GRID DISPLAY */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      text-align: left;
    }

    .stat-item {
      background: rgba(255, 42, 95, 0.06);
      border: 1px solid rgba(255, 42, 95, 0.2);
      padding: 10px 14px;
      border-radius: 10px;
      transition: background 0.3s;
    }

    .stat-item:hover {
      background: rgba(255, 42, 95, 0.12);
    }

    .stat-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      color: #00d4ff;
      letter-spacing: 1px;
      display: block;
      margin-bottom: 2px;
    }

    .stat-value {
      font-size: 1.15rem;
      font-weight: 600;
      color: #f1f5f9;
    }

    .instruction {
      color: #94a3b8;
      font-size: 1.2rem;
      letter-spacing: 1px;
    }

    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .loading-spinner {
      font-size: 3rem;
      color: #ff2a5f;
      filter: drop-shadow(0 0 12px rgba(255, 42, 95, 0.9));
    }

    .loading-text {
      color: #00d4ff;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.95rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .error-msg {
      color: #ff4d4d;
      font-size: 1.3rem;
      font-weight: 600;
      text-shadow: 0 0 8px rgba(255, 77, 77, 0.5);
    }

    /* BUTTON STYLING */
    button {
      background: linear-gradient(135deg, #ff2a5f 0%, #a80028 100%);
      color: #ffffff;
      border: none;
      padding: 16px 36px;
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 42, 95, 0.5);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    button:hover {
      background: linear-gradient(135deg, #ff4775 0%, #c90030 100%);
      box-shadow: 0 0 30px rgba(255, 42, 95, 0.8);
      transform: translateY(-3px) scale(1.02);
    }

    button:active {
      transform: translateY(1px) scale(0.98);
      box-shadow: 0 0 15px rgba(255, 42, 95, 0.4);
    }
  </style>
</head>
<body>

  <!-- Background Space & Star Layers -->
  <div class="space-bg"></div>
  <div class="stars-layer-1"></div>
  <div class="stars-layer-2"></div>

  <!-- Main Card Container -->
  <div class="container">
    <span class="header-badge">Galactic Archives</span>
    <h1 class="logo">STAR WARS</h1>
    
    <div class="card" id="card">
      <div class="card-corner top-left"></div>
      <div class="card-corner top-right"></div>
      <div class="card-corner bottom-left"></div>
      <div class="card-corner bottom-right"></div>

      <div id="content">
        <p class="instruction">Press button to query the database</p>
      </div>
    </div>

    <button id="find-btn">Find Someone</button>
  </div>

  <script>
    const findBtn = document.getElementById('find-btn');
    const contentDiv = document.getElementById('content');

    // Helper: Fetch Homeworld Name
    async function fetchHomeworld(url) {
      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error('Homeworld fetch failed');
        const data = await response.json();
        return data.result.properties.name;
      } catch (error) {
        return 'Unknown';
      }
    }

    // Primary Fetch Function
    async function getRandomCharacter() {
      displayLoading();

      const randomId = Math.floor(Math.random() * 83) + 1;

      try {
        const response = await fetch(`https://www.swapi.tech/api/people/${randomId}`);
        
        if (!response.ok) {
          throw new Error('Character not available');
        }

        const data = await response.json();
        const characterProps = data.result.properties;

        // Fetch Homeworld details asynchronously
        const homeworldName = await fetchHomeworld(characterProps.homeworld);

        const character = {
          name: characterProps.name,
          height: characterProps.height,
          gender: characterProps.gender,
          birthYear: characterProps.birth_year,
          homeWorld: homeworldName
        };

        displayCharacter(character);

      } catch (error) {
        displayError();
      }
    }

    // UI State 1: Loading
    function displayLoading() {
      contentDiv.innerHTML = `
        <div class="loading-container">
          <i class="fa-solid fa-circle-notch fa-spin loading-spinner"></i>
          <p class="loading-text">Scanning Galaxy...</p>
        </div>
      `;
    }

    // UI State 2: Display Character Grid Data
    function displayCharacter(char) {
      contentDiv.innerHTML = `
        <h2 class="char-title">${char.name}</h2>
        <div class="stats-grid">
          <div class="stat-item">
            <span class="stat-label">Height</span>
            <span class="stat-value">${char.height} cm</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Gender</span>
            <span class="stat-value">${char.gender}</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Birth Year</span>
            <span class="stat-value">${char.birthYear}</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Homeworld</span>
            <span class="stat-value">${char.homeWorld}</span>
          </div>
        </div>
      `;
    }

    // UI State 3: Error Message
    function displayError() {
      contentDiv.innerHTML = `
        <p class="error-msg">Oh No! That person isn't available.</p>
      `;
    }

    findBtn.addEventListener('click', getRandomCharacter);
  </script>
</body>
</html>
