<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ultra Arcade Pokédex</title>

  <!-- FontAwesome for icons -->
  <link 
    rel="stylesheet" 
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" 
  />
  
  <!-- Retro Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: #090a0f;
      background-image: 
        radial-gradient(rgba(255, 203, 5, 0.25) 1.5px, transparent 1.5px),
        radial-gradient(rgba(53, 100, 174, 0.25) 1.5px, transparent 1.5px);
      background-size: 30px 30px;
      background-position: 0 0, 15px 15px;
      font-family: 'VT323', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
      perspective: 1000px;
    }

    /* LOGO TITLE */
    .logo-container {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo {
      font-family: 'Press Start 2P', cursive;
      font-size: 2.4rem;
      color: #ffcb05;
      text-shadow: 
        -4px -4px 0 #3564ae,  
         4px -4px 0 #3564ae,
        -4px  4px 0 #3564ae,
         4px  4px 0 #3564ae,
         0 0 20px rgba(255, 203, 5, 0.6);
      letter-spacing: 4px;
      animation: logoPulse 2s infinite alternate ease-in-out;
    }

    @keyframes logoPulse {
      0% { transform: scale(1); filter: drop-shadow(0 0 5px #ffcb05); }
      100% { transform: scale(1.03); filter: drop-shadow(0 0 18px #ffcb05); }
    }

    /* POKEDEX DEVICE CONTAINER */
    .pokedex-wrapper {
      position: relative;
      width: 100%;
      max-width: 440px;
      transition: transform 0.1s ease-out;
      transform-style: preserve-3d;
    }

    .pokedex-device {
      background: linear-gradient(145deg, #e61035 0%, #99001a 100%);
      border: 5px solid #4a000c;
      border-radius: 24px;
      padding: 25px 22px;
      box-shadow: 
        0 25px 50px rgba(0, 0, 0, 0.9),
        inset 0 4px 8px rgba(255, 255, 255, 0.4),
        inset 0 -6px 10px rgba(0, 0, 0, 0.6);
      position: relative;
    }

    /* POKEBALL OPENING LID COVER */
    .pokedex-lid {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(180deg, #dc0a2d 50%, #f0f0f0 50%);
      border-radius: 20px;
      border: 5px solid #222;
      z-index: 50;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.5s ease;
      transform-origin: top center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      cursor: pointer;
    }

    .pokedex-lid.open {
      transform: rotateX(-110deg);
      opacity: 0;
      pointer-events: none;
    }

    .pokeball-latch {
      width: 80px;
      height: 80px;
      background: #ffffff;
      border: 8px solid #222;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 15px rgba(0,0,0,0.4);
      animation: latchPulse 1.5s infinite alternate;
    }

    .pokeball-latch-inner {
      width: 32px;
      height: 32px;
      background: #f0f0f0;
      border: 4px solid #222;
      border-radius: 50%;
    }

    .lid-text {
      position: absolute;
      bottom: 40px;
      font-family: 'Press Start 2P', cursive;
      font-size: 0.7rem;
      color: #333;
      letter-spacing: 1px;
    }

    @keyframes latchPulse {
      0% { transform: scale(1); box-shadow: 0 0 10px #ffffff; }
      100% { transform: scale(1.1); box-shadow: 0 0 25px #ffcb05; }
    }

    /* TOP SENSOR & LIGHT BAR */
    .sensor-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .camera-lens {
      width: 58px;
      height: 58px;
      background: radial-gradient(circle at 35% 35%, #85d7ff, #123d6b);
      border: 4px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.6);
      position: relative;
      transition: all 0.3s ease;
    }

    .camera-lens.active {
      animation: pulseLens 0.4s infinite alternate;
    }

    @keyframes pulseLens {
      from { box-shadow: 0 0 8px #00e1ff; filter: brightness(1); }
      to { box-shadow: 0 0 28px #00e1ff; filter: brightness(1.6); }
    }

    .led-bar {
      display: flex;
      gap: 10px;
    }

    .led {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid #222;
      opacity: 0.6;
      transition: opacity 0.2s, box-shadow 0.2s;
    }

    .led.active { opacity: 1; }
    .led-red { background: #ff3333; }
    .led-red.active { box-shadow: 0 0 10px #ff3333; }
    .led-yellow { background: #ffcc00; }
    .led-yellow.active { box-shadow: 0 0 10px #ffcc00; }
    .led-green { background: #33ff66; }
    .led-green.active { box-shadow: 0 0 10px #33ff66; }

    /* SCREEN DISPLAY */
    .screen-outer {
      background: #c5c5c5;
      border-radius: 14px;
      padding: 16px;
      border: 4px solid #757575;
      margin-bottom: 22px;
      box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.6);
    }

    .screen-inner {
      background: #0d120e;
      border-radius: 8px;
      min-height: 280px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 15px;
      color: #00ff66;
      border: 3px solid #050806;
      text-align: center;
      position: relative;
      overflow: hidden;
      transition: background 0.4s ease, border-color 0.4s ease;
    }

    /* CRT Scanlines Overlay */
    .screen-inner::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.4) 50%
      );
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 5;
    }

    .poke-img {
      width: 145px;
      height: 145px;
      object-fit: contain;
      image-rendering: pixelated;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,0.8));
      animation: floatSprite 2.5s ease-in-out infinite;
      z-index: 2;
    }

    @keyframes floatSprite {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .poke-title {
      font-size: 2.2rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 4px;
      color: #ffffff;
      text-shadow: 0 3px 6px rgba(0,0,0,0.9);
      z-index: 2;
    }

    .poke-id {
      font-size: 1.4rem;
      color: #ffcb05;
      margin-bottom: 6px;
      z-index: 2;
    }

    .stats-container {
      width: 100%;
      display: flex;
      justify-content: space-around;
      font-size: 1.4rem;
      border-top: 1px dashed rgba(255, 255, 255, 0.2);
      padding-top: 8px;
      margin-top: 5px;
      color: #fff;
      z-index: 2;
    }

    .type-badge {
      background: #ffcb05;
      color: #111;
      font-family: 'Press Start 2P', cursive;
      font-size: 0.65rem;
      padding: 6px 12px;
      border-radius: 6px;
      text-transform: uppercase;
      margin-top: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      z-index: 2;
    }

    /* CONTROLS AREA */
    .controls {
      display: grid;
      grid-template-columns: 1fr 1.2fr 1fr;
      gap: 12px;
      align-items: center;
    }

    .nav-btn {
      background: linear-gradient(180deg, #3a3a3a 0%, #1a1a1a 100%);
      color: #fff;
      border: 2px solid #000;
      padding: 14px 10px;
      font-family: 'Press Start 2P', cursive;
      font-size: 0.7rem;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 5px 0 #000;
      transition: all 0.1s ease;
    }

    .nav-btn:hover { background: #4a4a4a; }
    .nav-btn:active { transform: translateY(5px); box-shadow: 0 0 0 #000; }

    .random-btn {
      background: linear-gradient(180deg, #ffcb05 0%, #c79c00 100%);
      color: #1b3561;
      border: 2px solid #1b3561;
      padding: 16px 10px;
      font-family: 'Press Start 2P', cursive;
      font-size: 0.75rem;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 0 #102342;
      transition: all 0.1s ease;
    }

    .random-btn:hover { background: #ffd738; }
    .random-btn:active { transform: translateY(5px); box-shadow: 0 0 0 #102342; }

    .loading-spinner {
      font-size: 3.2rem;
      color: #ffcb05;
      margin-bottom: 12px;
    }

    .error-msg {
      color: #ff4d4d;
      font-size: 1.4rem;
    }
  </style>
</head>
<body>

  <div class="logo-container">
    <h1 class="logo">POKÉDEX</h1>
  </div>

  <div class="pokedex-wrapper" id="pokedex-wrapper">
    <div class="pokedex-device">

      <!-- FRONT COVER / POKEBALL LID -->
      <div class="pokedex-lid" id="pokedex-lid">
        <div class="pokeball-latch">
          <div class="pokeball-latch-inner"></div>
        </div>
        <p class="lid-text">TAP TO OPEN</p>
      </div>

      <!-- CAMERA & LED INDICATORS -->
      <div class="sensor-header">
        <div class="camera-lens" id="camera-lens"></div>
        <div class="led-bar">
          <div class="led led-red" id="led-red"></div>
          <div class="led led-yellow" id="led-yellow"></div>
          <div class="led led-green" id="led-green"></div>
        </div>
      </div>

      <!-- CRT DISPLAY SCREEN -->
      <div class="screen-outer">
        <div class="screen-inner" id="screen-content">
          <p style="color: #888; font-size: 1.3rem;">Press RANDOM or NAVIGATE to start!</p>
        </div>
      </div>

      <!-- CONTROLS -->
      <div class="controls">
        <button class="nav-btn" id="prev-btn">&lt; PREV</button>
        <button class="random-btn" id="random-btn">RANDOM</button>
        <button class="nav-btn" id="next-btn">NEXT &gt;</button>
      </div>

    </div>
  </div>

  <script>
    // Elements
    const pokedexLid = document.getElementById('pokedex-lid');
    const pokedexWrapper = document.getElementById('pokedex-wrapper');
    const screenContent = document.getElementById('screen-content');
    const cameraLens = document.getElementById('camera-lens');
    const randomBtn = document.getElementById('random-btn');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const ledRed = document.getElementById('led-red');
    const ledYellow = document.getElementById('led-yellow');
    const ledGreen = document.getElementById('led-green');

    let currentPokemonId = null;

    // Type Dynamic Palette
    const typeColors = {
      fire: '#661b14', water: '#143866', grass: '#174722', electric: '#5e5414',
      ice: '#194f5e', fighting: '#521d14', poison: '#421452', ground: '#523c14',
      flying: '#2d2361', psychic: '#5e143b', bug: '#3a4f14', rock: '#473e21',
      ghost: '#301c4c', dragon: '#1f1c61', dark: '#242028', steel: '#30373d',
      fairy: '#5e2346', normal: '#3d3a33'
    };

    // Synthesized Web Audio Engine
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'open') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.3);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
      } else if (type === 'click') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(450, now);
        osc.frequency.exponentialRampToValueAtTime(900, now + 0.08);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
        osc.start(now); osc.stop(now + 0.08);
      } else if (type === 'success') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.08);
        osc.frequency.setValueAtTime(783.99, now + 0.16);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
        osc.start(now); osc.stop(now + 0.25);
      } else if (type === 'error') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.setValueAtTime(120, now + 0.1);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
        osc.start(now); osc.stop(now + 0.25);
      }
    }

    // Interactive Lid Toggle
    pokedexLid.addEventListener('click', () => {
      playSound('open');
      pokedexLid.classList.add('open');
      if (!currentPokemonId) getRandomPokemon();
    });

    // Subtle 3D Mouse Parallax Effect
    document.addEventListener('mousemove', (e) => {
      const x = (window.innerWidth / 2 - e.pageX) / 45;
      const y = (window.innerHeight / 2 - e.pageY) / 45;
      pokedexWrapper.style.transform = `rotateY(${-x}deg) rotateX(${y}deg)`;
    });

    // LED Sequencer Animation
    let ledInterval;
    function startLeds() {
      let step = 0;
      ledInterval = setInterval(() => {
        ledRed.classList.toggle('active', step === 0);
        ledYellow.classList.toggle('active', step === 1);
        ledGreen.classList.toggle('active', step === 2);
        step = (step + 1) % 3;
      }, 150);
    }

    function stopLeds(success = true) {
      clearInterval(ledInterval);
      ledRed.classList.toggle('active', !success);
      ledYellow.classList.toggle('active', false);
      ledGreen.classList.toggle('active', success);
    }

    // Data Fetching
    async function fetchPokemon(idOrName) {
      displayLoading();

      try {
        const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${idOrName}`);
        if (!response.ok) throw new Error('Not found');

        const data = await response.json();
        currentPokemonId = data.id;

        const pokemonData = {
          id: data.id,
          name: data.name,
          image: data.sprites.front_default || data.sprites.other['official-artwork'].front_default,
          height: data.height / 10,
          weight: data.weight / 10,
          type: data.types.map(t => t.type.name).join(' / '),
          primaryType: data.types[0].type.name
        };

        stopLeds(true);
        playSound('success');
        displayPokemon(pokemonData);
      } catch (error) {
        stopLeds(false);
        playSound('error');
        displayError();
      }
    }

    function displayLoading() {
      cameraLens.classList.add('active');
      startLeds();
      screenContent.style.background = '#0d120e';
      screenContent.innerHTML = `
        <i class="fa-solid fa-spinner fa-spin loading-spinner"></i>
        <p style="font-size: 1.3rem;">Scanning Database...</p>
      `;
    }

    function displayPokemon(pokemon) {
      cameraLens.classList.remove('active');
      const bgAccent = typeColors[pokemon.primaryType] || '#0d120e';
      screenContent.style.background = `radial-gradient(circle at center, ${bgAccent} 0%, #060806 100%)`;

      screenContent.innerHTML = `
        <img class="poke-img" src="${pokemon.image}" alt="${pokemon.name}" />
        <h2 class="poke-title">${pokemon.name}</h2>
        <span class="poke-id">#${String(pokemon.id).padStart(3, '0')}</span>
        
        <div class="stats-container">
          <span>HT: ${pokemon.height}m</span>
          <span>WT: ${pokemon.weight}kg</span>
        </div>
        
        <div class="type-badge">${pokemon.type}</div>
      `;
    }

    function displayError() {
      cameraLens.classList.remove('active');
      screenContent.style.background = '#330c0c';
      screenContent.innerHTML = `
        <p class="error-msg">Signal Lost! Pokémon not found...</p>
      `;
    }

    // Button Listeners
    async function getRandomPokemon() {
      playSound('click');
      const randomId = Math.floor(Math.random() * 898) + 1;
      await fetchPokemon(randomId);
    }

    async function getPreviousPokemon() {
      playSound('click');
      const nextId = (!currentPokemonId || currentPokemonId <= 1) ? 898 : currentPokemonId - 1;
      await fetchPokemon(nextId);
    }

    async function getNextPokemon() {
      playSound('click');
      const nextId = (!currentPokemonId || currentPokemonId >= 898) ? 1 : currentPokemonId + 1;
      await fetchPokemon(nextId);
    }

    randomBtn.addEventListener('click', getRandomPokemon);
    prevBtn.addEventListener('click', getPreviousPokemon);
    nextBtn.addEventListener('click', getNextPokemon);
  </script>
</body>
</html>
