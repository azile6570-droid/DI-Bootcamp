<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giphy Random GIF Search</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      line-height: 1.6;
    }
    .form-container {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      padding: 8px 12px;
      font-size: 14px;
      width: 250px;
    }
    button {
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .btn-delete-all {
      background-color: #dc3545;
      color: white;
      border: none;
    }
    .gif-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 20px;
    }
    .gif-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background-color: #f9f9f9;
    }
    .gif-card img {
      max-height: 200px;
      border-radius: 4px;
    }
    .btn-delete-single {
      background-color: #ff6b6b;
      color: white;
      border: none;
      width: 100%;
    }
  </style>
</head>
<body>

  <h1>Giphy Random GIF Search</h1>

  <form id="gif-form" class="form-container">
    <input type="text" id="category-input" placeholder="Enter category (e.g. sun)..." required>
    <button type="submit">Fetch GIF</button>
    <button type="button" id="delete-all-btn" class="btn-delete-all">DELETE ALL</button>
  </form>

  <div id="gif-container" class="gif-container"></div>

  <script>
    const API_KEY = "hpvZycW22qCjn5cRM1xtWB8NKq4dQ2My";
    const gifForm = document.getElementById("gif-form");
    const categoryInput = document.getElementById("category-input");
    const container = document.getElementById("gif-container");
    const deleteAllBtn = document.getElementById("delete-all-btn");

    const fetchGif = async (category) => {
      const url = `https://api.giphy.com/v1/gifs/random?api_key=${API_KEY}&tag=${encodeURIComponent(category)}&rating=g`;

      try {
        const response = await fetch(url);

        if (!response.ok) {
          throw new Error(`HTTP Error! Status: ${response.status}`);
        }

        const { data } = await response.json();

        if (!data || Array.isArray(data) || !data.images) {
          alert(`No GIF found for category "${category}"`);
          return;
        }

        const gifUrl = data.images.fixed_height.url;

        const card = document.createElement("div");
        card.className = "gif-card";

        const img = document.createElement("img");
        img.src = gifUrl;
        img.alt = category;

        const deleteBtn = document.createElement("button");
        deleteBtn.textContent = "DELETE";
        deleteBtn.className = "btn-delete-single";

        deleteBtn.addEventListener("click", () => {
          card.remove();
        });

        card.appendChild(img);
        card.appendChild(deleteBtn);
        container.appendChild(card);

      } catch (error) {
        console.error("Error fetching GIF:", error.message);
      }
    };

  
    gifForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const category = categoryInput.value.trim();
      if (category) {
        fetchGif(category);
        categoryInput.value = ""; 
      }
    });

    deleteAllBtn.addEventListener("click", () => {
      container.innerHTML = "";
    });
  </script>

</body>
</html>
