<!DOCTYPE html>
<html>
<head>

            margin: 20px;
        }
        
        section {

            border: 1px solid #ddd;
            padding: 20px;
        }
        
        p {
          background: yellow;
          color: red;
        }
        
        #container {
          width: 400px;
          height: 400px;
          position: relative;
          background: yellow;
          margin: 20px 0;
        }
        
        #animate {
          width: 50px;
          height: 50px;
          position: absolute;
          background-color: red;
        }
    </style>
</head>
<body>
    <h1>Animations Exercises</h1>
    
    <!-- Exercise 1: Timer -->
    <section id="exercise1">
        <h2>Exercise 1: Timer</h2>
        <div id="container"></div>
        <button id="clear">Clear Interval</button>
    </section>
    
    <!-- Exercise 2: Move the box -->
    <section id="exercise2">
        <h2>Exercise 2: Move the box</h2>
        <p><button onclick="myMove()">Click Me</button></p>
        <div id="container2">
          <div id="animate"></div>
        </div>
    </section>

    <script src="Exercise xp animations.js"></script>
</body>
</html>
