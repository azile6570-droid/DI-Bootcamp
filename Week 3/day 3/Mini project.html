<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Double Slider Sign In/Up Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 14px 28px rgba(0, 0, 0, 0.25), 0 10px 10px rgba(0, 0, 0, 0.22);
            position: relative;
            overflow: hidden;
            width: 768px;
            max-width: 100%;
            min-height: 480px;
        }

        .form-container {
            position: absolute;
            top: 0;
            height: 100%;
            transition: all 0.6s ease-in-out;
        }

        .sign-in-container {
            left: 0;
            width: 50%;
            z-index: 2;
        }

        .sign-up-container {
            left: 0;
            width: 50%;
            opacity: 0;
            z-index: 1;
        }

        .container.right-panel-active .sign-in-container {
            transform: translateX(100%);
        }

        .container.right-panel-active .sign-up-container {
            transform: translateX(100%);
            opacity: 1;
            z-index: 5;
        }

        form {
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 0 50px;
            height: 100%;
            text-align: center;
        }

        input {
            background: #eee;
            border: none;
            padding: 12px 15px;
            margin: 8px 0;
            width: 100%;
            border-radius: 5px;
        }

        input::placeholder {
            color: #999;
        }

        button {
            border-radius: 20px;
            border: 1px solid #667eea;
            background: #667eea;
            color: white;
            font-size: 12px;
            font-weight: bold;
            padding: 12px 45px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: transform 0.1s ease-in;
            cursor: pointer;
            margin-top: 10px;
        }

        button:active {
            transform: scale(0.95);
        }

        button:focus {
            outline: none;
        }

        button.ghost {
            background-color: transparent;
            border-color: white;
        }

        .ghost {
            background-color: transparent;
            border-color: white;
        }

        h1 {
            font-weight: bold;
            margin-bottom: 20px;
        }

        span {
            font-size: 12px;
            margin: 15px 0 50px;
        }

        a {
            color: #333;
            font-size: 14px;
            text-decoration: none;
            margin: 15px 0;
        }

        .ghost-btn {
            background-color: transparent;
            border-color: white;
        }

        .panels-container {
            position: absolute;
            height: 100%;
            width: 100%;
            display: flex;
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: space-around;
            color: white;
            text-align: center;
            transform: translateX(0);
            transition: transform 0.6s ease-in-out;
            padding: 0 40px;
            position: absolute;
            height: 100%;
            width: 50%;
            top: 0;
        }

        .left-panel {
            pointer-events: none;
            transform: translateX(-100%);
            background: linear-gradient(to right, #667eea, #764ba2);
            left: 0;
        }

        .right-panel {
            right: 0;
            background: linear-gradient(to right, #764ba2, #667eea);
        }

        .container.right-panel-active .left-panel {
            transform: translateX(0);
        }

        .container.right-panel-active .right-panel {
            transform: translateX(100%);
        }

        .panel h1 {
            font-weight: 300;
        }

        .panel p {
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .form-container input {
            background: white;
        }

        form h1 {
            color: #333;
        }

        form a {
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container" id="container">
        <div class="form-container sign-up-container">
            <form action="#">
                <h1>Create Account</h1>
                <input type="text" placeholder="Name" />
                <input type="email" placeholder="Email" />
                <input type="password" placeholder="Password" />
                <button>Sign Up</button>
            </form>
        </div>

        <div class="form-container sign-in-container">
            <form action="#">
                <h1>Sign In</h1>
                <input type="email" placeholder="Email" />
                <input type="password" placeholder="Password" />
                <a href="#">Forgot your password?</a>
                <button>Sign In</button>
            </form>
        </div>

        <div class="panels-container">
            <div class="panel left-panel">
                <div class="content">
                    <h1>New here?</h1>
                    <p>Sign up and discover a great amount of new opportunities!</p>
                    <button class="ghost ghost-btn" id="signUp">Sign Up</button>
                </div>
            </div>

            <div class="panel right-panel">
                <div class="content">
                    <h1>One of us?</h1>
                    <p>If you already have an account, just sign in. We've missed you!</p>
                    <button class="ghost ghost-btn" id="signIn">Sign In</button>
                </div>
            </div>
        </div>
    </div>

    <script src="Mini project.js"></script>
</body>
</html>
