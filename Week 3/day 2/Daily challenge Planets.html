<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Challenge: Create a solar system</title>
        <style>
            body {
                background-color: black;
                padding: 10px;
                font-family: Arial, sans-serif;
            }
            .listPlanets {
                display: flex;
                flex-wrap: wrap;
                gap: 40px;
                padding: 20px;
            }
            .planet {
                width: 100px;
                height: 100px;
                border-radius: 50%;
                text-align: center;
                padding: 10px;
                position: relative;
                border: 2px solid white;
                display: flex;
                align-items: center;
                justify-content: center;
                color: white;
                font-weight: bold;
                font-size: 12px;
            }
            .moon {
                position: absolute;
                width: 30px;
                height: 30px;
                border-radius: 50%;
                background: rgb(237, 237, 237);
                border: 2px solid gray;
            }
            /* Planet colors */
            .mercury {
                background-color: #8c7853;
            }
            .venus {
                background-color: #ffc649;
            }
            .earth {
                background-color: #4a90e2;
            }
            .mars {
                background-color: #e27b58;
            }
            .jupiter {
                background-color: #c88b3a;
            }
            .saturn {
                background-color: #fad5a5;
            }
            .uranus {
                background-color: #4fd0e7;
            }
            .neptune {
                background-color: #4166f5;
            }
        </style>
    </head>
    <body>

    <section class="listPlanets"></section>

    <script src="Daily challenge Planets.js"></script>
    </body>
</html>
